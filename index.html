<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZX AI Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            animation: moveGradient 20s ease infinite;
            z-index: 0;
        }
        
        @keyframes moveGradient {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, -5%) scale(1.1); }
        }
        
        .watermark {
            position: fixed;
            bottom: 20px;
            right: 30px;
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.3;
            z-index: 1000;
            pointer-events: none;
            letter-spacing: -2px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s;
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #a78bfa 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }
        
        .tagline {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .mode-switch {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .mode-btn {
            padding: 15px 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .mode-btn.active {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
        }
        
        .mode-btn:hover {
            transform: translateY(-2px);
            border-color: #8b5cf6;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .video-section {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        #video {
            width: 100%;
            border-radius: 20px;
            background: #000;
            display: none;
            position: relative;
        }
        
        .video-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        #canvas {
            display: none;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }
        
        .btn-primary:hover {
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
            transform: translateY(-3px);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        
        .btn:disabled {
            background: #374151;
            color: #6b7280;
            cursor: not-allowed;
            transform: none;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .stats-card {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .stats-title {
            font-size: 13px;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .counter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .counter-item {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .counter-label {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .counter-value {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .detection-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .detection-item {
            background: rgba(139, 92, 246, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #8b5cf6;
            font-size: 13px;
            animation: slideInRight 0.3s;
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #8b5cf6;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }
        
        .gallery-section {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .slider-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }
        
        .slider-track {
            display: flex;
            transition: transform 0.5s ease;
        }
        
        .slide {
            min-width: 100%;
            position: relative;
        }
        
        .slide img {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 20px;
        }
        
        .slide-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 30px;
            border-radius: 0 0 20px 20px;
        }
        
        .slide-label {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
        }
        
        .slide-meta {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }
        
        .slider-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .slider-btn {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .slider-btn:hover {
            background: rgba(139, 92, 246, 0.5);
            border-color: #8b5cf6;
        }
        
        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .dot.active {
            background: #8b5cf6;
            width: 30px;
            border-radius: 5px;
        }
        
        .delete-slide {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }
        
        .delete-slide:hover {
            background: #dc2626;
            transform: scale(1.1);
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: 600;
            animation: slideDown 0.3s;
            border-left: 4px solid;
            backdrop-filter: blur(10px);
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert-info {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border-color: #3b82f6;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border-color: #10b981;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #8b5cf6;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .timer-display {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.8);
        }
    </style>
</head>
<body>
    <div class="watermark">zx</div>
    
    <div class="container">
        <div class="header">
            <div class="logo">ZX AI TRACKER</div>
            <div class="tagline">Real-Time Object Detection & Counting</div>
        </div>
        
        <div class="mode-switch">
            <button class="mode-btn active" data-mode="live">🎥 LIVE TRACKING</button>
            <button class="mode-btn" data-mode="capture">📷 CAPTURE MODE</button>
        </div>
        
        <div id="alertBox" class="alert alert-info hidden"></div>
        
        <div class="main-content">
            <div class="video-section">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                
                <div class="controls">
                    <button class="btn btn-primary" id="startBtn">🚀 START</button>
                    <button class="btn btn-success hidden" id="captureBtn">📸 CAPTURE</button>
                    <button class="btn btn-danger hidden" id="stopBtn">⏹️ STOP</button>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="stats-card">
                    <div class="stats-title">⚡ Live Detection</div>
                    
                    <div class="input-group">
                        <label>Target Objek</label>
                        <select id="targetObject">
                            <option value="person">👤 Person (Orang)</option>
                            <option value="car">🚗 Car (Mobil)</option>
                            <option value="motorcycle">🏍️ Motorcycle (Motor)</option>
                            <option value="bicycle">🚲 Bicycle (Sepeda)</option>
                            <option value="bus">🚌 Bus</option>
                            <option value="truck">🚚 Truck</option>
                            <option value="all">🎯 All Objects</option>
                        </select>
                    </div>
                    
                    <div class="counter-grid">
                        <div class="counter-item">
                            <div class="counter-label">Total Count</div>
                            <div class="counter-value" id="totalCount">0</div>
                        </div>
                        <div class="counter-item">
                            <div class="counter-label">Current Frame</div>
                            <div class="counter-value" id="currentCount">0</div>
                        </div>
                    </div>
                    
                    <div class="timer-display" id="timerDisplay">00:00:00</div>
                    
                    <button class="btn btn-primary" id="resetCounter">🔄 RESET</button>
                    
                    <div class="detection-list" id="detectionLog"></div>
                </div>
                
                <div class="stats-card">
                    <div class="stats-title">📊 Statistics</div>
                    <div class="input-group">
                        <label>Label / Kategori</label>
                        <input type="text" id="categoryInput" placeholder="Misal: Jalan Sudirman">
                    </div>
                    <button class="btn btn-success" id="exportBtn" disabled>💾 EXPORT DATA</button>
                </div>
            </div>
        </div>
        
        <div class="gallery-section">
            <div class="stats-title">📸 Captured Photos (<span id="photoCount">0</span>)</div>
            
            <div class="slider-container" id="sliderContainer">
                <div class="slider-track" id="sliderTrack">
                    <div class="slide" style="display: flex; align-items: center; justify-content: center; height: 400px; color: rgba(255,255,255,0.3); font-size: 18px;">
                        Belum ada foto
                    </div>
                </div>
            </div>
            
            <div class="slider-nav">
                <button class="slider-btn" id="prevBtn">◀ Previous</button>
                <button class="slider-btn" id="nextBtn">Next ▶</button>
            </div>
            
            <div class="slider-dots" id="sliderDots"></div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        let stream = null;
        let model = null;
        let detectionInterval = null;
        let mode = 'live';
        
        let totalCount = 0;
        let seenObjects = new Set();
        let dataCollected = [];
        let currentSlide = 0;
        
        let startTime = null;
        let timerInterval = null;
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const exportBtn = document.getElementById('exportBtn');
        const resetBtn = document.getElementById('resetCounter');
        
        const targetSelect = document.getElementById('targetObject');
        const categoryInput = document.getElementById('categoryInput');
        const alertBox = document.getElementById('alertBox');
        
        const totalCountEl = document.getElementById('totalCount');
        const currentCountEl = document.getElementById('currentCount');
        const detectionLog = document.getElementById('detectionLog');
        const timerDisplay = document.getElementById('timerDisplay');
        
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderDots = document.getElementById('sliderDots');
        const photoCountEl = document.getElementById('photoCount');
        
        // Load AI model
        async function loadModel() {
            showAlert('⏳ Loading AI model...', 'info');
            model = await cocoSsd.load();
            showAlert('✅ AI model ready! Deteksi otomatis aktif', 'success');
        }
        
        loadModel();
        
        // Mode switch
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
                
                if (mode === 'live') {
                    captureBtn.classList.add('hidden');
                } else {
                    if (stream) captureBtn.classList.remove('hidden');
                }
            });
        });
        
        function showAlert(message, type = 'info') {
            alertBox.innerHTML = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3000);
        }
        
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const hours = Math.floor(elapsed / 3600000);
                const minutes = Math.floor((elapsed % 3600000) / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                
                timerDisplay.textContent = 
                    `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }
        
        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                
                if (mode === 'capture') {
                    captureBtn.classList.remove('hidden');
                }
                
                if (mode === 'live') {
                    startLiveDetection();
                    startTimer();
                }
                
                showAlert('🎥 Kamera aktif!', 'success');
            } catch (err) {
                showAlert('❌ Gagal akses kamera: ' + err.message, 'info');
            }
        });
        
        async function startLiveDetection() {
            if (!model) return;
            
            detectionInterval = setInterval(async () => {
                const predictions = await model.detect(video);
                const target = targetSelect.value;
                
                let filtered = predictions;
                if (target !== 'all') {
                    filtered = predictions.filter(p => p.class === target);
                }
                
                currentCountEl.textContent = filtered.length;
                
                // Track unique objects for total count
                filtered.forEach(pred => {
                    const key = `${pred.class}_${Math.round(pred.bbox[0])}_${Math.round(pred.bbox[1])}`;
                    if (!seenObjects.has(key)) {
                        seenObjects.add(key);
                        totalCount++;
                        totalCountEl.textContent = totalCount;
                        
                        addDetectionLog(pred.class, Math.round(pred.score * 100));
                    }
                });
                
            }, 500); // Detect every 500ms
        }
        
        function addDetectionLog(objectClass, confidence) {
            const now = new Date().toLocaleTimeString('id-ID');
            const div = document.createElement('div');
            div.className = 'detection-item';
            div.innerHTML = `<strong>${objectClass}</strong> detected (${confidence}%) - ${now}`;
            
            detectionLog.insertBefore(div, detectionLog.firstChild);
            
            if (detectionLog.children.length > 10) {
                detectionLog.removeChild(detectionLog.lastChild);
            }
        }
        
        captureBtn.addEventListener('click', async () => {
            captureBtn.disabled = true;
            captureBtn.innerHTML = '<span class="loading"></span> Processing...';
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.9);
            
            let detectedObjects = [];
            if (model) {
                const predictions = await model.detect(video);
                detectedObjects = predictions.map(p => `${p.class} (${Math.round(p.score * 100)}%)`);
            }
            
            const category = categoryInput.value.trim() || 'general';
            const timestamp = new Date().toLocaleString('id-ID');
            const filename = `capture_${dataCollected.length}_${Date.now()}.jpg`;
            
            const record = {
                id: dataCollected.length,
                filename,
                timestamp,
                category,
                detected: detectedObjects.join(', ') || 'Tidak ada deteksi',
                imageData,
                totalCount: totalCount,
                duration: timerDisplay.textContent
            };
            
            dataCollected.push(record);
            updateSlider();
            exportBtn.disabled = false;
            
            showAlert(`✅ Foto tersimpan! ${detectedObjects.length} objek terdeteksi`, 'success');
            
            captureBtn.disabled = false;
            captureBtn.innerHTML = '📸 CAPTURE';
        });
        
        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
            }
            
            if (detectionInterval) clearInterval(detectionInterval);
            stopTimer();
            
            startBtn.classList.remove('hidden');
            captureBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
            
            showAlert('📵 Tracking dihentikan', 'info');
        });
        
        resetBtn.addEventListener('click', () => {
            if (confirm('Reset semua counter?')) {
                totalCount = 0;
                seenObjects.clear();
                totalCountEl.textContent = '0';
                currentCountEl.textContent = '0';
                detectionLog.innerHTML = '';
                
                stopTimer();
                timerDisplay.textContent = '00:00:00';
                
                if (stream && mode === 'live') {
                    startTimer();
                }
                
                showAlert('🔄 Counter direset', 'info');
            }
        });
        
        function updateSlider() {
            if (dataCollected.length === 0) return;
            
            sliderTrack.innerHTML = '';
            sliderDots.innerHTML = '';
            
            dataCollected.forEach((record, idx) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.innerHTML = `
                    <button class="delete-slide" onclick="deletePhoto(${record.id})">✕</button>
                    <img src="${record.imageData}" alt="${record.category}">
                    <div class="slide-info">
                        <div class="slide-label">${record.category}</div>
                        <div class="slide-meta">
                            🤖 ${record.detected}<br>
                            📊 Total Count: ${record.totalCount} | ⏱️ ${record.duration}<br>
                            🕐 ${record.timestamp}
                        </div>
                    </div>
                `;
                sliderTrack.appendChild(slide);
                
                const dot = document.createElement('div');
                dot.className = `dot ${idx === currentSlide ? 'active' : ''}`;
                dot.onclick = () => goToSlide(idx);
                sliderDots.appendChild(dot);
            });
            
            photoCountEl.textContent = dataCollected.length;
            goToSlide(dataCollected.length - 1);
        }
        
        function goToSlide(index) {
            if (dataCollected.length === 0) return;
            
            currentSlide = Math.max(0, Math.min(index, dataCollected.length - 1));
            sliderTrack.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            document.querySelectorAll('.dot').forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlide);
            });
        }
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            goToSlide(currentSlide - 1);
        });
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            goToSlide(currentSlide + 1);
        });
        
        window.deletePhoto = function(id) {
            if (!confirm('Hapus foto ini?')) return;
            
            dataCollected = dataCollected.filter(r => r.id !== id);
            updateSlider();
            
            if (dataCollected.length === 0) {
                exportBtn.disabled = true;
                sliderTrack.innerHTML = '<div class="slide" style="display: flex; align-items: center; justify-content: center; height: 400px; color: rgba(255,255,255,0.3); font-size: 18px;">Belum ada foto</div>';
                photoCountEl.textContent = '0';
            }
            
            showAlert('🗑️ Foto dihapus', 'info');
        }
        
        exportBtn.addEventListener('click', async () => {
            if (dataCollected.length === 0) return;
            
            showAlert('📦 Membuat export file...', 'info');
            exportBtn.disabled = true;
            
            const zip = new JSZip();
            const imgFolder = zip.folder('images');
            
            let csv = 'id,filename,timestamp,category,detected_objects,total_count,duration\n';
            dataCollected.forEach(record => {
                csv += `${record.id},"${record.filename}","${record.timestamp}","${record.category}","${record.detected}",${record.totalCount},"${record.duration}"\n`;
                
                const base64Data = record.imageData.split(',')[1];
                imgFolder.file(record.filename, base64Data, {base64: true});
            });
            
            zip.file('tracking_data.csv', csv);
            
            // Summary report
            const summary = `
ZX AI TRACKER - SUMMARY REPORT
========================================
Total Photos: ${dataCollected.length}
Final Count: ${totalCount}
Duration: ${timerDisplay.textContent}
Target: ${targetSelect.options[targetSelect.selectedIndex].text}
Location: ${categoryInput.value || 'N/A'}
Generated: ${new Date().toLocaleString('id-ID')}
            `.trim();
            
            zip.file('summary.txt', summary);
            
            const blob = await zip.generateAsync({type: 'blob'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `zx_tracking_${Date.now()}.zip`;
            a.click();
            
            showAlert('✅ Export berhasil!', 'success');
            exportBtn.disabled = false;
        });
        
        // Auto-save to localStorage
        setInterval(() => {
            localStorage.setItem('zx_data', JSON.stringify({
                dataCollected,
                totalCount,
                seenObjects: Array.from(seenObjects)
            }));
        }, 5000);
        
        // Load from localStorage
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('zx_data');
            if (saved) {
                const data = JSON.parse(saved);
                dataCollected = data.dataCollected || [];
                totalCount = data.totalCount || 0;
                seenObjects = new Set(data.seenObjects || []);
                
                totalCountEl.textContent = totalCount;
                if (dataCollected.length > 0) {
                    updateSlider();
                    exportBtn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
