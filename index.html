<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Data Collector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 110, 199, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(88, 166, 255, 0.3) 0%, transparent 50%);
            animation: gradient 15s ease infinite;
            z-index: -1;
        }
        
        @keyframes gradient {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-10%, 10%) rotate(180deg); }
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 
                0 20px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 40px;
            font-size: 14px;
        }
        
        .ai-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        input {
            width: 100%;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            font-size: 16px;
            color: #fff;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }
        
        input::placeholder {
            color: #555;
        }
        
        #video {
            width: 100%;
            border-radius: 20px;
            background: #000;
            display: none;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        #canvas {
            display: none;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(72, 187, 120, 0.5);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f56565 0%, #c53030 100%);
            color: white;
        }
        
        .btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .preview-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s;
            animation: fadeIn 0.5s;
            position: relative;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .preview-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }
        
        .preview-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .preview-info {
            padding: 15px;
            font-size: 13px;
        }
        
        .preview-label {
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
            font-size: 15px;
        }
        
        .preview-category {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .preview-detected {
            display: inline-block;
            background: rgba(102, 126, 234, 0.2);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            color: #667eea;
            margin-top: 8px;
        }
        
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(245, 101, 101, 0.9);
            border: none;
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        
        .delete-btn:hover {
            background: #c53030;
            transform: scale(1.1);
        }
        
        .stats {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 20px;
            margin-top: 30px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stats h3 {
            background: linear-gradient(135deg, #667eea, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 24px;
            margin-bottom: 15px;
        }
        
        .hidden {
            display: none;
        }
        
        .alert {
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            font-weight: 500;
            animation: slideDown 0.3s;
            border-left: 4px solid;
        }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .alert-info {
            background: rgba(66, 153, 225, 0.2);
            color: #90cdf4;
            border-color: #4299e1;
        }
        
        .alert-success {
            background: rgba(72, 187, 120, 0.2);
            color: #9ae6b4;
            border-color: #48bb78;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="ai-badge">🤖 AI-Powered Detection</span>
        <h1>AI Data Collector</h1>
        <p class="subtitle">Deteksi objek otomatis dengan TensorFlow.js</p>
        
        <div id="alertBox" class="alert alert-info hidden"></div>
        
        <div class="input-group">
            <label for="labelInput">Label Manual (Opsional)</label>
            <input type="text" id="labelInput" placeholder="Kosongkan untuk deteksi otomatis">
        </div>
        
        <div class="input-group">
            <label for="categoryInput">Kategori</label>
            <input type="text" id="categoryInput" placeholder="Contoh: elektronik, furniture">
        </div>
        
        <button class="btn btn-primary" id="startBtn">🎥 Buka Kamera</button>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        
        <button class="btn btn-success hidden" id="captureBtn">📷 AMBIL FOTO</button>
        <button class="btn btn-danger hidden" id="stopBtn">❌ Tutup Kamera</button>
        
        <div class="stats">
            <h3>Foto Terkumpul: <span id="photoCount">0</span></h3>
            <button class="btn btn-primary" id="exportBtn" disabled>💾 Download Data (ZIP)</button>
        </div>
        
        <div class="preview-grid" id="previewGrid"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        let stream = null;
        let dataCollected = [];
        let photoCount = 0;
        let model = null;
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const stopBtn = document.getElementById('stopBtn');
        const exportBtn = document.getElementById('exportBtn');
        
        const labelInput = document.getElementById('labelInput');
        const categoryInput = document.getElementById('categoryInput');
        const previewGrid = document.getElementById('previewGrid');
        const photoCountSpan = document.getElementById('photoCount');
        const alertBox = document.getElementById('alertBox');
        
        // Load AI model
        async function loadModel() {
            showAlert('⏳ Loading AI model...', 'info');
            model = await cocoSsd.load();
            showAlert('✅ AI model siap! Deteksi otomatis aktif', 'success');
        }
        
        loadModel();
        
        function showAlert(message, type = 'info') {
            alertBox.innerHTML = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 3000);
        }
        
        startBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                
                video.srcObject = stream;
                video.style.display = 'block';
                
                startBtn.classList.add('hidden');
                captureBtn.classList.remove('hidden');
                stopBtn.classList.remove('hidden');
                
                showAlert('🎥 Kamera aktif!', 'success');
            } catch (err) {
                showAlert('❌ Gagal akses kamera: ' + err.message, 'info');
            }
        });
        
        captureBtn.addEventListener('click', async () => {
            captureBtn.disabled = true;
            captureBtn.innerHTML = '<span class="loading"></span> Mendeteksi...';
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            const imageData = canvas.toDataURL('image/jpeg', 0.9);
            
            // AI Detection
            let detectedObjects = [];
            if (model) {
                const predictions = await model.detect(video);
                detectedObjects = predictions.map(p => `${p.class} (${Math.round(p.score * 100)}%)`);
            }
            
            const label = labelInput.value.trim() || 
                         (detectedObjects.length > 0 ? detectedObjects[0].split(' ')[0] : 'unlabeled');
            const category = categoryInput.value.trim() || 'general';
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const filename = `photo_${String(photoCount).padStart(4, '0')}_${timestamp}.jpg`;
            
            const record = {
                photo_id: photoCount,
                filename: filename,
                timestamp: new Date().toLocaleString('id-ID'),
                label: label,
                category: category,
                detected: detectedObjects.join(', ') || 'Tidak terdeteksi',
                imageData: imageData
            };
            
            dataCollected.push(record);
            photoCount++;
            
            addPreview(record);
            updateStats();
            saveToLocalStorage();
            
            labelInput.value = '';
            categoryInput.value = '';
            
            showAlert(`✅ Foto ${photoCount} tersimpan! ${detectedObjects.length > 0 ? '🤖 ' + detectedObjects[0] : ''}`, 'success');
            
            captureBtn.disabled = false;
            captureBtn.innerHTML = '📷 AMBIL FOTO';
        });
        
        stopBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                
                startBtn.classList.remove('hidden');
                captureBtn.classList.add('hidden');
                stopBtn.classList.add('hidden');
                
                showAlert('📵 Kamera ditutup', 'info');
            }
        });
        
        function addPreview(record) {
            const div = document.createElement('div');
            div.className = 'preview-item';
            div.dataset.id = record.photo_id;
            div.innerHTML = `
                <button class="delete-btn" onclick="deletePhoto(${record.photo_id})">✕</button>
                <img src="${record.imageData}" alt="${record.label}">
                <div class="preview-info">
                    <div class="preview-label">${record.label}</div>
                    <div class="preview-category">${record.category}</div>
                    <div class="preview-detected">🤖 ${record.detected}</div>
                    <div style="color: #555; font-size: 11px; margin-top: 8px;">${record.timestamp}</div>
                </div>
            `;
            previewGrid.insertBefore(div, previewGrid.firstChild);
        }
        
        window.deletePhoto = function(photoId) {
            if (!confirm('Hapus foto ini?')) return;
            
            dataCollected = dataCollected.filter(r => r.photo_id !== photoId);
            document.querySelector(`.preview-item[data-id="${photoId}"]`).remove();
            
            photoCount = dataCollected.length;
            updateStats();
            saveToLocalStorage();
            
            showAlert('🗑️ Foto dihapus', 'info');
        }
        
        function updateStats() {
            photoCountSpan.textContent = photoCount;
            exportBtn.disabled = photoCount === 0;
        }
        
        exportBtn.addEventListener('click', async () => {
            if (dataCollected.length === 0) return;
            
            showAlert('📦 Membuat file ZIP...', 'info');
            exportBtn.disabled = true;
            
            const zip = new JSZip();
            const imgFolder = zip.folder('images');
            
            let csv = 'photo_id,filename,timestamp,label,category,detected_objects\n';
            dataCollected.forEach(record => {
                csv += `${record.photo_id},"${record.filename}","${record.timestamp}","${record.label}","${record.category}","${record.detected}"\n`;
                
                const base64Data = record.imageData.split(',')[1];
                imgFolder.file(record.filename, base64Data, {base64: true});
            });
            
            zip.file('metadata.csv', csv);
            
            const blob = await zip.generateAsync({type: 'blob'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ai_data_collection_${Date.now()}.zip`;
            a.click();
            
            showAlert('✅ Download berhasil!', 'success');
            exportBtn.disabled = false;
        });
        
        function saveToLocalStorage() {
            localStorage.setItem('dataCollected', JSON.stringify(dataCollected));
        }
        
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('dataCollected');
            if (saved) {
                dataCollected = JSON.parse(saved);
                photoCount = dataCollected.length;
                dataCollected.forEach(record => addPreview(record));
                updateStats();
            }
        }
        
        window.addEventListener('load', loadFromLocalStorage);
        window.addEventListener('beforeunload', saveToLocalStorage);
    </script>
</body>
</html>
